name: CI

on:
  push:
  pull_request:

env:
  # HMAC_SECRET is required so we use a mocked one to ensure CI works as expected.
  HMAC_SECRET: 'ci-hmac-secret-fixture-please-do-not-use-in-prod-32chars'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # Informational only: no coverage threshold gates the build, this is
      # the one step allowed to fail without failing the job.
      - name: Coverage report
        run: pnpm test:cov
        continue-on-error: true

      # Informational only: a new advisory published upstream must not turn
      # a green commit red without any code change.
      - name: Dependency audit
        run: pnpm audit --prod
        continue-on-error: true
