name: Verify

on:
  # Branch commits are covered by the pull_request run; without this filter
  # every commit on a PR branch triggers two identical runs, and concurrency
  # cannot dedupe them because the two events carry a different github.ref.
  push:
    branches: [main]
  pull_request:

env:
  # SIGNER_SECRET is required so we use a mocked one to ensure CI works as expected.
  SIGNER_SECRET: 'ci-hmac-secret-fixture-please-do-not-use-in-prod-32chars'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a run on main is not.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version read from the "packageManager" field of package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # Informational only: no coverage threshold gates the build, this is
      # the one step allowed to fail without failing the job.
      - name: Coverage report
        run: pnpm test:cov
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # Informational only: a new advisory published upstream must not turn
      # a green commit red without any code change.
      - name: Dependency audit
        run: pnpm audit --prod
        continue-on-error: true
